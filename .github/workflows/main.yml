name: Sync Fork

on:
workflow_dispatch:
schedule:
- cron: "0 */6 * * *"

permissions:
contents: write

jobs:
sync:
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Backup workflows
    run: |
      mkdir -p /tmp/workflows
      cp -r .github/workflows/* /tmp/workflows/ || true

  - name: Sync upstream
    run: |
      git remote add upstream https://github.com/PrismLauncher/meta-launcher.git || true
      git fetch upstream

      git reset --hard upstream/master

  - name: Restore workflows
    run: |
      mkdir -p .github/workflows
      cp -r /tmp/workflows/* .github/workflows/ || true

  - name: Commit workflows
    run: |
      git add .github/workflows
      git commit -m "Restore workflows after sync" || true

  - name: Push
    run: |
      git push origin master --force
```
